# Local development stack. Run from the solution root:
#   docker compose up --build
# Tokens: dotnet user-jwts create --project src/Services/ServiceNameService/ServiceName.API --scope "service-names:read" --scope "service-names:write"
services:
  servicename-api:
    build:
      context: .
      dockerfile: src/Services/ServiceNameService/Dockerfile
    ports:
      - "5911:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
#if (UsePostgres)
      ConnectionStrings__ServiceNameDb: "Host=servicename-db;Port=5432;Database=servicename;Username=postgres;Password=postgres"
#elif (UseSqlite)
      ConnectionStrings__ServiceNameDb: "Data Source=/data/servicename.db"
#else
      ConnectionStrings__ServiceNameDb: "Server=servicename-db,1433;Database=ServiceName;User Id=sa;Password=Dev_Passw0rd!;TrustServerCertificate=True;Encrypt=True"
#endif
    volumes:
      # Shares the signing keys created by `dotnet user-jwts` with the container (Development only).
      - ${HOME}/.microsoft/usersecrets/88d9f70f-77db-454c-8506-0f7c4519abcf:/home/app/.microsoft/usersecrets/88d9f70f-77db-454c-8506-0f7c4519abcf:ro
#if (UseSqlite)
      - servicename-data:/data
#endif
#if (!UseSqlite)
    depends_on:
      servicename-db:
        condition: service_healthy
#endif
    restart: unless-stopped
#if (UsePostgres)

  servicename-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: servicename
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - servicename-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servicename"]
      interval: 5s
      timeout: 5s
      retries: 20
#elif (UseSqlServer)

  servicename-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - servicename-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Dev_Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
#endif

volumes:
  servicename-data:
