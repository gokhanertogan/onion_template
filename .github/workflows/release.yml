name: release

# Publishes the template package to NuGet.org when a version tag (v1.2.3) is pushed.
# Requires the NUGET_API_KEY secret (repository or "nuget" environment secret).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    uses: ./.github/workflows/template-ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: verify
    environment: nuget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack Onion.Templates.csproj -o artifacts -p:PackageVersion="${GITHUB_REF_NAME#v}"

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY" || { echo "::error::NUGET_API_KEY secret is not set"; exit 1; }
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
