name: release

# Publishes the template package to NuGet.org when a version tag (v1.2.3) is pushed.
# Uses NuGet Trusted Publishing: a short-lived API key is obtained through GitHub OIDC, so no secret is stored.
# The trusted publishing policy on nuget.org must point at this repository and release.yml.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    uses: ./.github/workflows/template-ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: verify
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack Onion.Templates.csproj -o artifacts -p:PackageVersion="${GITHUB_REF_NAME#v}"

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: GokhanErtogan

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      # A GitHub release shows up in followers' feeds and links the NuGet package to its changelog.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --generate-notes --verify-tag \
            --title "OnionArchitecture.Templates ${GITHUB_REF_NAME#v}"
