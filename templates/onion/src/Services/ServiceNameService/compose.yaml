# ServiceName API for the local development stack. Included by the root docker-compose.yml;
# paths are relative to this file, the build context is the solution root.
# Tokens: dotnet user-jwts create --project src/Services/ServiceNameService/ServiceName.API --scope "service-names:read" --scope "service-names:write"
services:
  servicename-api:
    build:
      context: ../../..
      dockerfile: src/Services/ServiceNameService/Dockerfile
    ports:
      - "5911:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
#if (UsePostgres)
      ConnectionStrings__ServiceNameDb: "Host=db;Port=5432;Database=servicename;Username=postgres;Password=postgres"
#elif (UseSqlite)
      ConnectionStrings__ServiceNameDb: "Data Source=/data/servicename.db"
#else
      ConnectionStrings__ServiceNameDb: "Server=db,1433;Database=ServiceName;User Id=sa;Password=Dev_Passw0rd!;TrustServerCertificate=True;Encrypt=True"
#endif
    volumes:
      # Shares the signing keys created by `dotnet user-jwts` with the container (Development only).
      - ${HOME}/.microsoft/usersecrets/88d9f70f-77db-454c-8506-0f7c4519abcf:/home/app/.microsoft/usersecrets/88d9f70f-77db-454c-8506-0f7c4519abcf:ro
#if (UseSqlite)
      - servicename-data:/data
#endif
#if (!UseSqlite)
    # "db" is the shared database server defined in the root docker-compose.yml.
    depends_on:
      db:
        condition: service_healthy
#endif
    restart: unless-stopped
#if (UseSqlite)

volumes:
  servicename-data:
#endif
