# Local development stack. Run from the solution root:
#   docker compose up --build
# Every service brings its own compose.yaml; add new services to the include list
# (create_project.sh does this automatically).
include:
  - src/Services/ServiceNameService/compose.yaml
#if (!UseSqlite)

# One database server shared by all services; each service uses its own database on it,
# created on startup by the service itself.
services:
#endif
#if (UsePostgres)
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
#elif (UseSqlServer)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Dev_Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
#endif
#if (!UseSqlite)

volumes:
  db-data:
#endif
