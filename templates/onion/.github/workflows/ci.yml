name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Vulnerable packages (fail on any)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q -E "has the following vulnerable packages" vulnerable.txt

      # Code style (IDE*) rules are enforced by the build (EnforceCodeStyleInBuild + TreatWarningsAsErrors).
      # `dotnet format style` is not used: it also checks using order, and the template's using order
      # depends on the service name, so a fresh "Basket" or "Catalog" service would fail it.
      - name: Format check
        run: dotnet format whitespace --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images
        run: |
          for dockerfile in src/Services/*/Dockerfile; do
            name=$(basename "$(dirname "$dockerfile")" Service | tr '[:upper:]' '[:lower:]')
            echo "::group::$name-api"
            docker build -f "$dockerfile" -t "$name-api:${{ github.sha }}" .
            echo "::endgroup::"
          done
